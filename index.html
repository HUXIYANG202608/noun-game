<title>名词变形记 · 外研版《名词与数词》闯关</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#eef2f9;--card:#fff;--ink:#16233a;--ink2:#5b6b85;--line:#dfe6f2;--soft:#f3f6fc;
  --pri:#2f6df6;--pri2:#1d4fd1;--ok:#0f9d58;--no:#e5484d;--warn:#e08c00;
  --r:16px;--pad:15px;--fs-q:25px;--fs-o:16px;--fs-s:13px;--fs-t:18px;
}
@media (min-width:820px){:root{--fs-q:31px;--fs-o:18px;--fs-s:14px;--fs-t:21px;--pad:20px;--r:18px}}
@media (min-width:1280px){:root{--fs-q:39px;--fs-o:21px;--fs-s:16px;--fs-t:25px;--pad:26px;--r:20px}}
@media (min-width:1700px){:root{--fs-q:47px;--fs-o:25px;--fs-s:18px;--fs-t:29px;--pad:32px}}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:var(--fs-o);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:var(--pad);min-height:100vh;
  display:flex;flex-direction:column;gap:12px}
@media (min-width:820px){.wrap{max-width:800px}}
@media (min-width:1280px){.wrap{max-width:940px}}
@media (min-width:1700px){.wrap{max-width:1120px}}
button{font-family:inherit}
h1,h2,h3,p{margin:0}

/* ---------- 首页 ---------- */
.hero{padding:14px 0 4px}
.hero h1{font-size:calc(var(--fs-q)*1.15);letter-spacing:1px}
.hero .sub{color:var(--ink2);font-size:var(--fs-s);margin-top:8px;line-height:1.6}
.lv{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:2px solid var(--line);
  border-radius:var(--r);padding:14px 16px;text-align:left;cursor:pointer;transition:.15s;color:var(--ink)}
.lv:hover{border-color:#b9cdfb;transform:translateY(-1px)}
.lv .no{flex:0 0 44px;height:44px;border-radius:12px;background:var(--pri);color:#fff;font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--fs-o)*1.15)}
.lv.done .no{background:var(--ok)}
.lv .tt{flex:1;min-width:0}
.lv .tt b{display:block;font-size:calc(var(--fs-o)*1.12)}
.lv .tt span{display:block;color:var(--ink2);font-size:var(--fs-s);margin-top:3px}
.lv .tt span.nw{display:inline;white-space:nowrap}
.lv .st{flex:0 0 auto;color:#d5dbe7;font-size:calc(var(--fs-o)*1.1);letter-spacing:2px}
.lv .st i{font-style:normal;color:#f6b100}
.swrow{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);
  border-radius:var(--r);padding:12px 16px;font-size:var(--fs-s);color:var(--ink2)}
.swrow b{color:var(--ink);font-size:var(--fs-o)}
.sw{position:relative;width:52px;height:30px;flex:0 0 52px;margin-left:auto}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#cbd5e6;border-radius:99px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--pri)}
.sw input:checked+span:before{transform:translateX(22px)}
.tips{background:#fff;border:2px dashed var(--line);border-radius:var(--r);padding:14px 16px;
  font-size:var(--fs-s);color:var(--ink2);line-height:1.85}
.tips b{color:var(--ink)}

/* ---------- 答题页 ---------- */
.hud{display:flex;align-items:center;gap:10px;padding-top:4px}
.hud .badge{background:var(--pri);color:#fff;border-radius:99px;padding:6px 14px;font-size:var(--fs-s);font-weight:700}
.hud .cnt{margin-left:auto;color:var(--ink2);font-size:var(--fs-s)}
.hud .back{background:var(--card);border:2px solid var(--line);border-radius:11px;width:38px;height:38px;
  font-size:17px;cursor:pointer;color:var(--ink);line-height:1}
.tbar{height:8px;background:#dde4f0;border-radius:99px;overflow:hidden;position:relative}
.tbar i{display:block;height:100%;background:var(--pri);width:100%;transition:width .25s linear,background .3s}
.tbar i.warn{background:var(--warn)}
.tbar i.danger{background:var(--no)}
.tmeta{display:flex;justify-content:space-between;font-size:var(--fs-s);color:var(--ink2);margin-top:-4px}
.tmeta .sec{font-weight:700;font-variant-numeric:tabular-nums}
main.rt{flex:1 0 auto;display:flex;flex-direction:column;gap:12px;justify-content:center;
  touch-action:pan-y;transition:transform .18s ease}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;position:relative}
.qcard .tag{display:inline-block;background:var(--soft);color:var(--pri2);border-radius:8px;padding:3px 10px;
  font-size:var(--fs-s);font-weight:700;margin-bottom:10px}
.qcard .qtext{font-size:var(--fs-q);font-weight:800;line-height:1.35;letter-spacing:.5px;word-break:break-word}
.qcard .qtext.sent{font-size:calc(var(--fs-q)*.86);font-weight:700;line-height:1.5}
.qcard .hint{color:var(--ink2);font-size:var(--fs-s);margin-top:10px}
.blk{display:inline-block;min-width:2.6em;border-bottom:2px solid var(--pri);margin:0 4px;
  vertical-align:-2px;height:.92em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;background:var(--card);
  border:2px solid var(--line);border-radius:14px;padding:12px 15px;font-size:var(--fs-o);color:var(--ink);
  text-align:left;cursor:pointer;transition:.15s}
@media (min-width:1280px){.opt{min-height:66px;border-radius:16px}}
.opt:hover{border-color:#b9cdfb;background:#fafcff}
.opt .k{flex:0 0 32px;height:32px;border-radius:10px;background:var(--soft);color:var(--ink2);font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--fs-s)*1.05)}
.opt .tx{flex:1;word-break:break-word;line-height:1.35}
.opt.ok{border-color:var(--ok);background:#e9f7f0}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:#fdecec}
.opt.no .k{background:var(--no);color:#fff}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.fbc{border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--card);display:none}
.fbc.show{display:block;animation:pop .22s ease}
.fbc.ok{border-color:#a8ddc0;background:#f2fbf6}
.fbc.no{border-color:#f3b6b8;background:#fef6f6}
.fbc .fbh{font-weight:800;font-size:var(--fs-t);margin-bottom:8px}
.fbc.ok .fbh{color:var(--ok)}
.fbc.no .fbh{color:var(--no)}
.fbc .fbr{line-height:1.6;margin-bottom:6px}
.fbc .fbc2{color:var(--ink2);font-size:var(--fs-s);line-height:1.85;border-top:1px dashed var(--line);padding-top:8px}
.spk{display:none;margin-top:12px;background:var(--pri);border:none;color:#fff;border-radius:11px;
  padding:11px 16px;font-size:var(--fs-o);font-weight:700;cursor:pointer;min-height:46px}
.spk.show{display:inline-block}
.spk:hover{background:var(--pri2)}
.swhint{text-align:center;color:#a6b2c7;font-size:var(--fs-s);padding:2px 0 4px}
footer.sticky{padding-top:2px}
.pkw .sticky{position:sticky;bottom:0;z-index:6;background:linear-gradient(to bottom,rgba(238,242,249,0),#eef2f9 42%);padding-top:10px}
.btn{width:100%;min-height:56px;border:none;border-radius:14px;background:var(--pri);color:#fff;
  font-size:var(--fs-t);font-weight:800;cursor:pointer;letter-spacing:1px;transition:.15s}
.btn:hover{background:var(--pri2)}
.btn:disabled{background:#c9d4e8;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.ok{background:var(--ok)}

/* ---------- 结算 ---------- */
.rt-wrap{flex:1;display:flex;flex-direction:column;justify-content:center}
.result{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:26px 20px;text-align:center}
.result .stars{font-size:calc(var(--fs-q)*1.6);letter-spacing:8px;color:#d5dbe7;line-height:1.2}
.result .stars i{font-style:normal;color:#f6b100;animation:pop .35s ease both}
.result h2{font-size:var(--fs-t);margin:12px 0 6px}
.result .note{color:var(--ink2);font-size:var(--fs-s);line-height:1.9}
.result .sc{font-size:calc(var(--fs-q)*.9);font-weight:800;color:var(--pri);margin-top:8px;font-variant-numeric:tabular-nums}
.rbtns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .28s ease}
.note-top{text-align:center;color:var(--ink2);font-size:var(--fs-s);line-height:1.8;padding:2px 8px 8px}

/* ---------- 双人 PK ---------- */
.pkentry .no{background:#7c3aed;font-size:calc(var(--fs-o)*.95)}
.pkvs{text-align:center;font-size:calc(var(--fs-q)*1.05);font-weight:800;letter-spacing:2px;padding:6px 0 0}
.pkvs.w0{color:#1d4fd1}
.pkvs.w1{color:#c62828}
.pkvs.wt{color:var(--ink2)}
.pkbody{display:flex;gap:10px;align-items:stretch;flex:1 0 auto}
.pkp{flex:1 1 0;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:var(--r);
  padding:12px;display:flex;flex-direction:column;gap:8px}
.pkp.b{border-color:#bcd3fb;background:#f7faff}
.pkp.r{border-color:#f6cccc;background:#fffafa}
.pkmid{flex:0 0 34px;display:flex;align-items:center;justify-content:center}
.pkmid span{background:#5b6b85;color:#fff;border-radius:99px;width:34px;height:34px;display:flex;
  align-items:center;justify-content:center;font-size:calc(var(--fs-s)*.95);font-weight:800}
.pkhead{display:flex;align-items:center;gap:8px}
.pkname{border-radius:99px;padding:4px 12px;font-size:var(--fs-s);font-weight:800;background:#e8f0fe;color:#1d4fd1}
.pkname.r{background:#fdecec;color:#c62828}
.pksc{margin-left:auto;font-size:calc(var(--fs-t)*.95);font-weight:800;font-variant-numeric:tabular-nums;color:#1d4fd1}
.pkp.r .pksc{color:#c62828}
.pkt{display:flex;justify-content:space-between;font-size:var(--fs-s);color:var(--ink2)}
.pkt .sec{font-weight:700;font-variant-numeric:tabular-nums}
.pktag{align-self:flex-start;background:var(--soft);color:var(--pri2);border-radius:8px;padding:2px 8px;
  font-size:calc(var(--fs-s)*.92);font-weight:700}
.pkq{font-size:calc(var(--fs-q)*.68);font-weight:800;line-height:1.35;word-break:break-word;padding:2px 0}
.pkq.sent{font-size:calc(var(--fs-q)*.58);font-weight:700;line-height:1.5}
.pkmain{margin:auto 0;display:flex;flex-direction:column;gap:8px;min-height:0}
.pkopts{display:flex;flex-direction:column;gap:7px}
.pkopt{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;background:#fff;border:2px solid var(--line);
  border-radius:12px;padding:8px 11px;font-size:calc(var(--fs-o)*.92);color:var(--ink);text-align:left;cursor:pointer}
.pkopt .k{flex:0 0 26px;height:26px;border-radius:8px;background:var(--soft);color:var(--ink2);font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--fs-s)*.9)}
.pkopt .tx{flex:1;word-break:break-word;line-height:1.3}
.pkopt:active{border-color:#b9cdfb;background:#fafcff}
.pkp.lock .pkopt{opacity:.5;pointer-events:none}
.pkfb{min-height:20px;font-size:var(--fs-s);font-weight:800;text-align:center}
.pkfb.ok{color:var(--ok)}
.pkfb.no{color:var(--no)}
.pkdone{margin:auto;text-align:center;line-height:1.9;font-size:var(--fs-s);color:var(--ink2)}
.pkdone b{font-size:calc(var(--fs-q)*.7);color:var(--ink);display:block}
.pkrev{display:flex;flex-direction:column;gap:10px}
.pkrevit{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px}
.pkrevit .rq{font-weight:700;margin-bottom:6px;line-height:1.45}
.pkrevit .ra{color:var(--ok);font-weight:800;margin-bottom:6px}
.pkrevit .rr{color:var(--ink2);font-size:var(--fs-s);line-height:1.85}
/* PK 局制 / 选手名 / 排行榜 */
.nmrow{display:flex;gap:10px}
.nmcell{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);
  border:2px solid var(--line);border-radius:var(--r);padding:9px 12px}
.nmcell.b{border-color:#bcd3fb;background:#f7faff}
.nmcell.r{border-color:#f6cccc;background:#fffafa}
.nmcell em{font-style:normal;font-weight:800;font-size:var(--fs-o);color:#1d4fd1}
.nmcell.r em{color:#c62828}
.nmcell input{flex:1;min-width:0;border:0;background:transparent;font-size:var(--fs-o);font-weight:700;
  color:var(--ink);outline:none;font-family:inherit}
.nmcell input::placeholder{color:#9aa8bd;font-weight:600}
.pkrow{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);
  border-radius:var(--r);padding:9px 12px}
.pkrow .lb{font-weight:700;color:var(--ink);font-size:var(--fs-s);flex:1;min-width:0;line-height:1.5}
.seg{margin-left:auto;display:flex;border:2px solid var(--line);border-radius:99px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:#fff;padding:8px 14px;font-size:var(--fs-s);font-weight:700;
  color:var(--ink2);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--pri);color:#fff}
.mvscore{display:flex;align-items:center;justify-content:center;gap:12px;padding:4px 0 2px;
  font-weight:800;font-size:calc(var(--fs-o)*1.15);font-variant-numeric:tabular-nums}
.mvscore .mb{color:#1d4fd1}
.mvscore .mr{color:#c62828}
.mvscore .md{color:var(--ink2);font-size:var(--fs-s);font-weight:700}
.streak{text-align:center;font-weight:700;color:#b45309;background:#fff8eb;border:2px dashed #f5d08a;
  border-radius:var(--r);padding:9px 12px;font-size:var(--fs-s);line-height:1.7}
.streak b{font-size:calc(var(--fs-o)*1.1)}
.board{display:flex;flex-direction:column;gap:8px}
.boardit{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);
  border-radius:var(--r);padding:10px 13px}
.boardit.hi{border-color:#f6b100;background:#fffdf5}
.boardit .rk{flex:0 0 34px;height:34px;border-radius:10px;background:var(--soft);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--fs-s)}
.boardit.hi .rk{background:#f6b100;color:#fff}
.boardit .bn{flex:1;min-width:0}
.boardit .bn b{display:block;font-size:var(--fs-o);word-break:break-word}
.boardit .bn span{display:block;color:var(--ink2);font-size:calc(var(--fs-s)*.9);margin-top:2px}
.boardit .bs{font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums;
  font-size:calc(var(--fs-o)*1.05);flex:0 0 auto}
.boardit.hi .bs{color:#b45309}
.revhd{margin:6px 0 -2px;font-weight:800;color:var(--pri2);font-size:var(--fs-s);
  background:var(--soft);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between}
.mvlist{display:flex;flex-direction:column;gap:6px}
.mvli{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);
  border-radius:10px;padding:8px 12px;font-size:var(--fs-s)}
.mvli .g{color:var(--ink2);flex:0 0 auto;font-weight:700}
.mvli .s{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.mvli .s.b{color:#1d4fd1}
.mvli .s.r{color:#c62828}
/* PK 各结果页的安全垂直居中（与 main.rt 同写法：flex-basis:auto + shrink:0，内容超高不裁顶） */
.pkpg{flex:1 0 auto;display:flex;flex-direction:column;gap:12px;justify-content:center}
@media (min-width:1280px){.pkopt{min-height:58px}.pkq{font-size:calc(var(--fs-q)*.6)}}
@media (min-width:1700px){.pkopt{min-height:68px}}
@media (min-width:1280px){.wrap.pkw{max-width:1200px}}
@media (min-width:1700px){.wrap.pkw{max-width:1560px}}
@media (max-width:780px) and (orientation:portrait){
  .pkbody{flex-direction:column}
  .pkmid{flex:0 0 26px}
  .pkmid span{width:26px;height:26px;font-size:calc(var(--fs-s)*.8)}
  .pkq{font-size:calc(var(--fs-q)*.78)}
  .pkopt{min-height:40px;padding:6px 10px}
}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="rt-wrap"><div class="result"><div class="stars">★★★</div>

    if(st>0)done++;
    total+=st;
    var sv="";for(var s=0;s<3;s++)sv+=s<st?"<i>★</i>":"★";
    h+='<button class="lv'+(st>0?" done":"")+'" data-lv="'+i+'"><span class="no">'+lv.id+'</span>'+
       '<span class="tt"><b>'+esc(lv.name)+'</b><span>'+esc(lv.sub)+'<span class="nw">　·　'+lv.qs.length+' 题</span></span></span>'+
       '<span class="st">'+sv+'</span></button>';
  }
  h+='<button class="lv pkentry" id="pkg"><span class="no">PK</span>'+
     '<span class="tt"><b>双人 PK</b><span>三局两胜　·　同题不同序　·　跨局不重复</span></span>'+
     '<span class="st">›</span></button>';
  var t=timedOn();
  h+='<div class="swrow"><span>⏱ <b>限时模式</b><br>每题 20–30 秒，超时算错</span>'+
     '<label class="sw"><input type="checkbox" id="tsw"'+(t?" checked":"")+'><span></span></label></div>';
  h+='<div class="tips"><b>怎么玩</b><br>'+
     '1. 点一个答案，答完立刻看到这条规则；<br>'+
     '2. 答错的题会进“错题口袋”，关末可以只重做错题；<br>'+
     '3. 手机左右滑动、电脑按 ← → 都能翻题，按 1–4 直接选；<br>'+
     '4. 答完可以点“听正确读音”跟着读一遍。</div>';
  h+='<div class="tips" style="text-align:center">已获 <b>'+total+'</b> / '+(BANK.length*3)+' 星　·　通关 <b>'+done+'</b> / '+BANK.length+' 关</div>';
  app.innerHTML=h;
  app.className="wrap";
  S.timed=t;
  var b=app.querySelectorAll(".lv[data-lv]");
  for(var k=0;k<b.length;k++)b[k].onclick=function(){unlock();startLevel(+this.getAttribute("data-lv"),false);};
  var pg=document.getElementById("pkg");
  if(pg)pg.onclick=function(){unlock();PK.scr="pkhome";renderPKHome();};
  var sw=document.getElementById("tsw");
  if(sw)sw.onchange=function(){setTimed(this.checked);};
}

/* ---------- 开始某关 ---------- */
function startLevel(idx,onlyWrong){
  var lv=BANK[idx];
  stopTimer();
  S.lv=idx;S.scr="play";S.retry=!!onlyWrong;
  S.qs=[];
  for(var i=0;i<lv.qs.length;i++){
    if(onlyWrong&&S.wrong.indexOf(i)<0)continue;
    var q=Object.assign({},lv.qs[i]);
    q.oi=[];for(var j=0;j<q.o.length;j++)q.oi.push(j);
    q.shuffled=shuffle(q.oi);
    q.correctIdx=-1;
    for(var j2=0;j2<q.o.length;j2++){if(h32(q.o[j2])===q.k){q.correctIdx=j2;break;}}
    S.qs.push(q);
  }
  S.i=0;S.score=0;S.combo=0;S.maxCombo=0;S.right=0;S.wrong=[];
  renderQ();
}

function curQ(){return S.qs[S.i];}

function renderQ(){
  var q=curQ(),lv=BANK[S.lv];
  S.answered=false;S.chosen=-1;S.timeout=false;
  var h='<header class="hud"><button class="back" id="bk">←</button>'+
    '<span class="badge">第'+lv.id+'关 · '+esc(lv.name)+'</span>'+
    '<span class="cnt">'+(S.i+1)+' / '+S.qs.length+'</span></header>';
  h+='<div class="tbar"><i id="tbar"></i></div><div class="tmeta"><span>⏱ 剩余</span><span class="sec" id="sec">--</span></div>';
  var qcls=(q.t==="mean"||q.t==="sent")?"qtext sent":"qtext";
  var qhtml=esc(q.q).replace(/_{3,}/g,'<span class="blk"></span>');
  h+='<main class="rt" id="rt"><div class="qcard"><span class="tag">'+esc(q.tag)+'</span>'+
     '<div class="'+qcls+'">'+qhtml+'</div><div class="hint">'+esc(q.h)+'</div>'+
     '<button class="spk" id="spk">🔊 听正确读音</button></div>';
  h+='<div class="opts" id="opts">';
  for(var n=0;n<q.shuffled.length;n++){
    var oi=q.shuffled[n];
    h+='<button class="opt" data-i="'+oi+'"><span class="k">'+"ABCD".charAt(n)+'</span><span class="tx">'+esc(q.o[oi])+'</span></button>';
  }
  h+='</div><div class="fbc" id="fb"></div>';
  if(S.i===0&&!S.retry)h+='<div class="swhint">← 左右滑动可以翻题 →</div>';
  h+='</main>';
  h+='<footer class="sticky"><button class="btn" id="nx" disabled>'+(S.i===S.qs.length-1?"看结果":"下一题")+'</button></footer>';
  app.innerHTML=h;

  var bs=app.querySelectorAll(".opt");
  for(var m=0;m<bs.length;m++)bs[m].onclick=function(){pick(+this.getAttribute("data-i"));};
  document.getElementById("bk").onclick=function(){stopTimer();S.scr="home";renderHome();};
  document.getElementById("nx").onclick=goNext;
  document.getElementById("spk").onclick=function(){play(q.aa);};
  bindSwipe(document.getElementById("rt"));
  startTimer();
}

/* ---------- 倒计时 ---------- */
function startTimer(){
  stopTimer();
  var q=curQ(),total=timedOn()?TIMER[q.t]||30:0;
  if(!total){document.getElementById("sec").textContent="不限时";
    document.getElementById("tbar").style.width="100%";return;}
  S.left=total;S.t0=Date.now();
  tick();
  S.tid=setInterval(tick,200);
}
function tick(){
  var q=curQ(),total=TIMER[q.t]||30;
  var el=document.getElementById("sec"),bar=document.getElementById("tbar");
  if(!el||!bar){stopTimer();return;}
  var left=Math.max(0,total-(Date.now()-S.t0)/1000);
  el.textContent=Math.ceil(left)+" 秒";
  var pc=left/total*100;
  bar.style.width=pc+"%";
  bar.className=left<=5?"danger":(left<=10?"warn":"");
  el.style.color=left<=5?"var(--no)":(left<=10?"var(--warn)":"");
  if(left<=0){stopTimer();timeUp();}
}
function stopTimer(){if(S.tid){clearInterval(S.tid);S.tid=null;}}

/* ---------- 判定 ---------- */
function pick(oi){
  if(JUST_SWIPED){JUST_SWIPED=false;return;}
  if(S.answered||oi<0)return;
  var q=curQ();
  if(oi!==q.correctIdx&&h32(q.o[oi])===q.k)q.correctIdx=oi;
  S.answered=true;S.chosen=oi;
  stopTimer();
  var ok=(oi===q.correctIdx);
  showResult(ok,false);
}
function timeUp(){
  if(S.answered)return;
  S.answered=true;S.chosen=-1;S.timeout=true;
  showResult(false,true);
}
function showResult(ok,isTimeout){
  var q=curQ(),bs=app.querySelectorAll(".opt");
  for(var i=0;i<bs.length;i++){
    var oi=+bs[i].getAttribute("data-i");
    bs[i].disabled=true;
    if(oi===q.correctIdx){bs[i].classList.add("ok");}
    else if(oi===S.chosen){bs[i].classList.add("no");}
    else{bs[i].classList.add("dim");}
  }
  if(ok){
    S.right++;S.combo++;if(S.combo>S.maxCombo)S.maxCombo=S.combo;
    var mult=S.combo>=5?2:(S.combo>=3?1.5:1);
    S.score+=Math.round(10*mult);
    praise("ok");
  }else{
    S.combo=0;
    if(isTimeout)S.timeout=true;
    var qi=S.qs.indexOf(q);
    if(S.wrong.indexOf(qi)<0)S.wrong.push(qi);
    praise("no");
  }
  var fb=document.getElementById("fb");
  var head=ok?'<div class="fbh">✅ '+pickPraise()+'</div>'
             :(isTimeout?'<div class="fbh">⏰ 时间到</div>':'<div class="fbh">❌ 差一点点</div>');
  fb.className="fbc show "+(ok?"ok":"no");
  fb.innerHTML=head+'<div class="fbr"><b>规则　</b>'+esc(q.r)+'</div>'+
     (q.c?"<div class=\"fbc2\">"+esc(q.c)+"</div>":"");
  var spk=document.getElementById("spk");
  /* 真题关的题没有音频，不显示读音按钮（否则是坏按钮） */
  if(spk&&q.aa)spk.classList.add("show");
  var nx=document.getElementById("nx");
  nx.disabled=false;
  nx.className="btn "+(ok?"ok":"");
  if(!ok)nx.className="btn";
  nx.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function pickPraise(){var a=["答对了","漂亮","就是它","稳","拿下一分"];return a[Math.floor(Math.random()*a.length)];}

/* ---------- 翻题 ---------- */
function goNext(){
  if(!S.answered)return;
  if(S.i>=S.qs.length-1){renderResult();return;}
  S.i++;renderQ();
}
function goPrev(){
  if(S.i<=0)return;
  S.i--;renderQ();
}

/* ---------- 结算 ---------- */
function starsOf(right,n){var a=right/n;if(a>=1)return 3;if(a>=0.8)return 2;return 1;}
function renderResult(){
  stopTimer();S.scr="result";
  var n=S.qs.length,st=starsOf(S.right,n),lv=BANK[S.lv];
  var p=PROG[lv.id]||{};
  if(!p.stars||st>p.stars||(st===p.stars&&S.score>(p.best||0))){
    PROG[lv.id]={stars:Math.max(st,p.stars||0),best:Math.max(S.score,p.best||0),
      right:Math.max(S.right,p.right||0),total:n};
    saveP(PROG);
  }
  var sv="";for(var i=0;i<3;i++)sv+=i<st?"<i>★</i>":"★";
  var h='<div class="rt-wrap"><div class="result"><div class="stars">'+sv+'</div>'+
    '<h2>'+(st===3?"全对，规则掌握了":(st===2?"不错，还有小漏洞":"再来一遍会更好"))+'</h2>'+
    '<div class="note">正确 '+S.right+' / '+n+'　·　最高连对 '+S.maxCombo+'<br>本关得分 <b>'+S.score+'</b></div>'+
    '<div class="sc">第'+lv.id+'关 · '+esc(lv.name)+'</div>';
  h+='<div class="rbtns">';
  if(S.wrong.length)h+='<button class="btn" id="rw">重做错题（'+S.wrong.length+' 题）</button>';
  h+='<button class="btn '+(S.wrong.length?"ghost":"")+'" id="ag">再练一遍</button>';
  if(S.lv<BANK.length-1)h+='<button class="btn ghost" id="nl">进入 第'+BANK[S.lv+1].id+'关 · '+esc(BANK[S.lv+1].name)+'</button>';
  h+='<button class="btn ghost" id="hm">返回首页</button></div></div></div>';
  app.innerHTML=h;
  var rw=document.getElementById("rw");
  if(rw)rw.onclick=function(){var w=S.wrong.slice();startLevel(S.lv,true);};
  document.getElementById("ag").onclick=function(){startLevel(S.lv,false);};
  document.getElementById("hm").onclick=function(){S.scr="home";renderHome();};
  var nl=document.getElementById("nl");
  if(nl)nl.onclick=function(){startLevel(S.lv+1,false);};
  window.scrollTo(0,0);
}

/* ---------- 滑动 ---------- */
var JUST_SWIPED=false;
function bindSwipe(el){
  if(!el)return;
  var x0=0,y0=0,dx=0,act=false;
  el.addEventListener("pointerdown",function(e){
    if(e.target.closest(".back"))return;          /* 返回键不参与滑动 */
    act=true;x0=e.clientX;y0=e.clientY;dx=0;
  });
  el.addEventListener("pointermove",function(e){
    if(!act)return;
    var ddx=e.clientX-x0,ddy=e.clientY-y0;
    if(Math.abs(ddy)>Math.abs(ddx)&&Math.abs(ddy)>24){act=false;el.style.transform="";return;}
    dx=ddx;
    el.style.transition="none";
    el.style.transform="translateX("+Math.max(-90,Math.min(90,ddx*0.45))+"px)";
  });
  function end(){
    if(!act)return;act=false;
    el.style.transition="transform .18s ease";el.style.transform="";
    var moved=Math.abs(dx)>=60;
    if(moved){JUST_SWIPED=true;setTimeout(function(){JUST_SWIPED=false;},280);}
    if(dx<-60){
      if(S.answered)goNext();
      else{el.classList.add("shake");setTimeout(function(){el.classList.remove("shake");},320);}
    }else if(dx>60){goPrev();}
  }
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
  el.addEventListener("pointerleave",end);
}

/* ---------- 键盘（希沃/电脑） ---------- */
document.addEventListener("keydown",function(e){
  if(S.scr!=="play")return;
  if(e.key>="1"&&e.key<="4"){var bs=app.querySelectorAll(".opt");var n=+e.key-1;
    if(bs[n])pick(+bs[n].getAttribute("data-i"));}
  else if(e.key==="ArrowRight"||e.key==="Enter"){if(S.answered)goNext();}
  else if(e.key==="ArrowLeft"){goPrev();}
  else if(e.key===" "){e.preventDefault();if(S.answered)goNext();}
});

/* ================= 双人 PK =================
   一局 8 题：五考点按 2/1/2/2/1 均衡抽（自然形成 3 变形选择 + 3 句子挖空 + 2 义项选择）。
   双方拿到同一批题，但题序独立打乱且强制「同一轮题号不同」，选项顺序也各自打乱。
   答完不标出正确项（同屏会被对手看到），解析统一放复盘页。 */
var PK_KEY="nwn_pk_v1_";
var PK_LIM={form:12,mean:15,cloze:20,sent:18,pick:18};
var PK_GROUP=[2,1,2,2,1];
var PK_BOARD_N=10;      /* 排行榜保留条数 */
var PK_BOARD_MIN=40;    /* 入榜最低分 */
/* 跨局去重：记录每桶已抽过的题号。某桶不够抽时只重置该桶，因此永不卡死，
   且题库 12 题/桶、每局抽 1~2 题，连玩 6 局都不会重题。 */
var PK_POOL=[[],[],[],[],[]];
var PK={scr:"home",mode:3,names:["",""],w:[0,0],cur:1,rounds:[],hit:[],
  set:[],play:[[],[]],P:[],tid:null,startAt:0,resultDone:false,matchDone:false};

function pkSfxOn(){try{return localStorage.getItem(PK_KEY+"sfx")==="1";}catch(e){return false;}}
function pkSetSfx(v){try{localStorage.setItem(PK_KEY+"sfx",v?"1":"0");}catch(e){}}
function pkLoad(){try{var s=JSON.parse(localStorage.getItem(PK_KEY+"stat"));
  if(s&&typeof s.g==="number")return s;}catch(e){}return {g:0,b:0,r:0,t:0};}
function pkSave(s){try{localStorage.setItem(PK_KEY+"stat",JSON.stringify(s));}catch(e){}}
function rng(n){var r=[],i;for(i=0;i<n;i++)r.push(i);return r;}
function pkModeGet(){try{var v=parseInt(localStorage.getItem(PK_KEY+"mode"),10);return v===1?1:3;}catch(e){return 3;}}
function pkModeSet(v){PK.mode=v;try{localStorage.setItem(PK_KEY+"mode",v===1?"1":"3");}catch(e){}}
function pkNamesLoad(){try{var a=JSON.parse(localStorage.getItem(PK_KEY+"names"));
  if(a&&a.length===2)return [String(a[0]||"").slice(0,6),String(a[1]||"").slice(0,6)];}catch(e){}return ["",""];}
function pkNamesSave(){try{localStorage.setItem(PK_KEY+"names",JSON.stringify(PK.names));}catch(e){}}
function pkName(p){var n=PK.names[p];return n?n:(p===0?"蓝方":"红方");}
function pkTime(ts){var d=new Date(ts||Date.now());
  function z(n){return n<10?"0"+n:""+n;}
  return z(d.getMonth()+1)+"-"+z(d.getDate())+" "+z(d.getHours())+":"+z(d.getMinutes());}
/* 初始化：选手名与局制从本机存档恢复 */
PK.names=pkNamesLoad();
PK.mode=pkModeGet();

function pkBucket(li,onlyForm){
  var a=BANK[li].qs,o=[],i;
  for(i=0;i<a.length;i++){if(!onlyForm||a[i].t==="form")o.push(a[i]);}
  return o;
}
function pkDraw(){
  var pick=[],li,j,b,n,avail,i;
  for(li=0;li<5;li++){
    /* 规则复数只从变形题里抽，保证每局至少 2 道变形选择；其余桶不过滤，让例外题也有机会出现 */
    b=pkBucket(li,li===0);n=PK_GROUP[li];
    avail=[];
    for(i=0;i<b.length;i++){if(PK_POOL[li].indexOf(i)<0)avail.push(i);}
    if(avail.length<n){PK_POOL[li]=[];avail=rng(b.length);}   /* 该桶抽完了→只重置该桶 */
    avail=shuffle(avail);
    for(j=0;j<n&&j<avail.length;j++){
      pick.push({li:li,q:b[avail[j]]});
      PK_POOL[li].push(avail[j]);
    }
  }
  return shuffle(pick);
}
/* 本场（含历史连续场次）已抽走多少题，用于提示题库在轮换 */
function pkDrawnCount(){var t=0,i;for(i=0;i<5;i++)t+=PK_POOL[i].length;return t;}
function pkPoolTotal(){var t=0,i;for(i=0;i<5;i++)t+=pkBucket(i,i===0).length;return t;}
function pkSameAt(a,b){for(var i=0;i<a.length;i++){if(a[i]===b[i])return true;}return false;}
function pkSide(order){
  var out=[],i,j,s,q,sh,ci,opts;
  for(i=0;i<order.length;i++){
    s=PK.set[order[i]];q=s.q;sh=shuffle(rng(q.o.length));ci=-1;
    for(j=0;j<q.o.length;j++){if(h32(q.o[j])===q.k){ci=j;break;}}
    opts=[];for(j=0;j<sh.length;j++)opts.push(q.o[sh[j]]);
    out.push({t:q.t,q:q.q,h:q.h,tag:q.tag,r:q.r,c:q.c,aa:q.aa,o:opts,qa:(ci<0?"":q.o[ci]),
      ci:sh.indexOf(ci),qi:order[i],lim:PK_LIM[q.t]||15});
  }
  return out;
}
function pkPrepare(){
  var n=PK.set.length,a=shuffle(rng(n)),b=shuffle(rng(n)),t=0;
  while(t<300&&pkSameAt(a,b)){b=shuffle(rng(n));t++;}
  PK.play[0]=pkSide(a);PK.play[1]=pkSide(b);
}

function pkNewP(){return {i:0,score:0,right:0,locked:false,done:false,log:[],left:0,t0:0,finishAt:0};}
function pkCur(p){return PK.play[p][PK.P[p].i];}
function pkAnsOf(w){var q=w.q,j;for(j=0;j<q.o.length;j++){if(h32(q.o[j])===q.k)return q.o[j];}return "";}
function pkLogIn(rd,p,qi){var L=rd.logs[p],i;for(i=0;i<L.length;i++){if(L[i].qi===qi)return L[i];}return null;}

/* 开一场：清大比分与局记录。跨局去重池 PK_POOL 故意不清空，让题目持续轮换不重复。 */
function pkStartMatch(){
  PK.w=[0,0];PK.cur=1;PK.rounds=[];PK.hit=[];
  PK.matchDone=false;
  pkStartRound();
}
function pkStartRound(){
  PK.hit=[];
  PK.set=pkDraw();pkPrepare();
  PK.P=[pkNewP(),pkNewP()];
  PK.startAt=Date.now();PK.resultDone=false;PK.scr="play";
  renderPK();
  PK.P[0].t0=Date.now();PK.P[0].left=pkCur(0).lim;
  PK.P[1].t0=Date.now();PK.P[1].left=pkCur(1).lim;
  pkPanel(0);pkPanel(1);
  pkLoop();
}
function pkLoop(){
  if(PK.tid)clearInterval(PK.tid);
  PK.tid=setInterval(function(){
    pkTick(0);pkTick(1);
    if(PK.P[0].done&&PK.P[1].done){pkStopLoop();pkResult();}
  },100);
}
function pkStopLoop(){if(PK.tid){clearInterval(PK.tid);PK.tid=null;}}

function pkTick(p){
  var P=PK.P[p];
  if(P.done||P.locked)return;
  var q=pkCur(p);
  if(!q)return;
  var lim=q.lim,left=Math.max(0,lim-(Date.now()-P.t0)/1000);
  P.left=left;
  var bar=document.getElementById("pkbar"+p),sec=document.getElementById("pksec"+p);
  if(bar){bar.style.width=(left/lim*100)+"%";bar.className=left<=5?"danger":(left<lim*.5?"warn":"");}
  if(sec){sec.textContent=Math.ceil(left)+" 秒";}
  if(left<=0)pkAnswer(p,-1);
}

function pkAnswer(p,oi){
  var P=PK.P[p];
  if(P.done||P.locked)return;
  var q=pkCur(p);
  if(!q)return;
  P.locked=true;
  var ok=(oi>=0&&oi===q.ci),gain=0;
  if(ok){gain=10+Math.round(P.left);P.score+=gain;P.right++;}
  P.log.push({qi:q.qi,ok:ok,timeout:oi<0,gain:gain,chosen:(oi<0?"":q.o[oi])});
  pkPanel(p);
  var fb=document.getElementById("pkfb"+p);
  if(fb){fb.className="pkfb "+(ok?"ok":"no");
    fb.textContent=ok?("答对　+"+gain+" 分"):(oi<0?"时间到　0 分":"没答对　0 分");}
  if(pkSfxOn())praise(ok?"ok":"no");
  setTimeout(function(){pkAdvance(p);},780);
}
function pkAdvance(p){
  var P=PK.P[p];
  if(P.done)return;
  P.locked=false;P.i++;
  if(P.i>=PK.play[p].length){P.done=true;P.finishAt=Date.now();pkPanel(p);return;}
  P.t0=Date.now();P.left=pkCur(p).lim;
  pkPanel(p);
}

function renderPK(){
  var modeTxt=PK.mode===1?"一局定胜负":"三局两胜";
  var h='<header class="hud"><button class="back" id="pkbk">←</button>'+
    '<span class="badge">双人 PK · 第 '+PK.cur+' 局</span><span class="cnt">'+modeTxt+'</span></header>';

/* ---------- 一局结束：结算 → 连胜 / 排行榜 → 判断比赛是否继续 ---------- */
function pkResult(){
  if(PK.resultDone)return;
  PK.resultDone=true;
  var A=PK.P[0],B=PK.P[1];
  var win=A.score>B.score?0:(B.score>A.score?1:-1);
  if(win===-1&&A.right!==B.right)win=A.right>B.right?0:1;
  var tA=Math.max(1,Math.round((A.finishAt-PK.startAt)/1000));
  var tB=Math.max(1,Math.round((B.finishAt-PK.startAt)/1000));
  /* 快照本局：题目与双方作答记录（PK.set / PK.P 下一局会被覆盖，复盘要用） */
  PK.rounds.push({a:A.score,b:B.score,ar:A.right,br:B.right,win:win,tA:tA,tB:tB,
    set:PK.set.slice(),logs:[A.log.slice(),B.log.slice()],gs:PK.play[0].length});
  PK.hit=pkSettleRound(win);
  if(win===0)PK.w[0]++;else if(win===1)PK.w[1]++;
  var need=PK.mode===1?1:2;          /* 三局两胜先赢 2 局；一局定胜负打 1 局 */
  var maxR=PK.mode===1?1:3;          /* 最多 3 局，平局也不会无限打下去 */
  if(PK.w[0]>=need||PK.w[1]>=need||PK.rounds.length>=maxR)pkMatchResult();
  else renderPRound(win,A,B,tA,tB);
}

/* 写统计 + 连胜 + 排行榜（一次读写，避免互相覆盖） */
function pkSettleRound(win){
  var st=pkLoad(),p;
  st.g=(st.g||0)+1;
  if(win===0)st.b=(st.b||0)+1;else if(win===1)st.r=(st.r||0)+1;else st.t=(st.t||0)+1;
  /* 连胜以「局」为单位，按左右位置记；平局中断连胜 */
  if(win===-1){st.streak={s:-1,n:0};}
  else{
    if(!st.streak)st.streak={s:-1,n:0};
    if(st.streak.s===win)st.streak.n=(st.streak.n||0)+1;else st.streak={s:win,n:1};
    if(!st.best)st.best={s:-1,n:0};
    if(st.streak.n>(st.best.n||0))st.best={s:win,n:st.streak.n};
  }
  /* 排行榜：只记单局得分（量纲一致，一局定胜负/三局两胜可比），Top N */
  var hit=[];
  for(p=0;p<2;p++){
    var Pp=PK.P[p];
    if(Pp.score<PK_BOARD_MIN)continue;
    var L=(st.board||[]).slice();
    var ent={nm:pkName(p),side:p,sc:Pp.score,rt:Pp.right,gs:PK.play[p].length,rd:PK.cur,ts:Date.now()};
    L.push(ent);
    L.sort(function(x,y){return y.sc-x.sc||y.rt-x.rt||x.ts-y.ts;});
    L=L.slice(0,PK_BOARD_N);
    st.board=L;
    var k=-1,q;
    for(q=0;q<L.length;q++){if(L[q]===ent){k=q;break;}}
    if(k>=0)hit.push({p:p,rank:k+1,sc:Pp.score});
  }
  pkSave(st);
  return hit;
}

  if(st.best&&st.best.n===sk.n)t+="　·　刷新最高纪录！";
